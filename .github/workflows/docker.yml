name: Docker image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-master
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaroslavsku/bw-task:latest
            ghcr.io/jaroslavsku/bw-task:${{ github.sha }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jaroslavsku/bw-task-migrate:latest
            ghcr.io/jaroslavsku/bw-task-migrate:${{ github.sha }}

      - name: Scan app image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/jaroslavsku/bw-task:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
